# Builds the Android debug APK.
#
# Three jobs, cheapest first, so a broken change fails in a minute instead of after a half-hour Gradle
# build:
#   checks  -- the AOT compiler's four test suites, the ETC2 transcoder, the native syntax check, and the
#              disc installer: the conformance corpus is generated, the TypeScript installer proves it
#              installs it, and the Kotlin port has to reproduce the same files byte for byte
#   image   -- the AOT image for the reference executable (only when its hash is known)
#   apk     -- Gradle + NDK build of the *debug* variant, signed with the key committed to the
#              repository, uploaded as an artifact
#
# Only the debug APK is built: it is the build a player installs, and it is signed with
# android/debug.keystore -- the same key in every checkout and on every runner -- so each new build
# replaces the installed app instead of asking for an uninstall, and the installed game files stay.
# (android/README.md, "Updating in place".)
name: Android APK

on:
  # Every branch: a feature branch must see its own results before it is merged. Testing showed why --
  # with `branches: [main]` a push to a working branch started no run at all.
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Tests and static checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        # Printed once so a failure can be tied to a version; nothing here depends on secrets, so a fork
        # and a pull request from a fork run exactly the same checks.
        run: |
          echo "runner: $(uname -sm), python $(python3 -V | cut -d' ' -f2), node $(node -v)"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          npm ci
          python3 -m pip install unicorn capstone

      - name: Encoder, code generator, module loader, optimiser
        run: |
          node aot/test/enc.test.mjs
          node aot/test/arch.test.mjs
          node aot/test/module.test.mjs
          node aot/test/opt.test.mjs

      - name: DXT -> ETC2 transcoder
        run: tools/etc2-test.sh

      - name: Kotlin compiler
        # The installer check compiles the APK's own installer sources, so a Kotlin compiler is needed
        # here. It comes from npm (the same package the build scripts accept through $KOTLINC) -- the
        # Android cmdline-tools do not ship one.
        run: |
          npm install --no-save --no-audit --no-fund kotlin-compiler@2.4.21
          echo "KOTLINC=$PWD/node_modules/kotlin-compiler/bin/kotlinc" >> "$GITHUB_ENV"
          "$PWD/node_modules/kotlin-compiler/bin/kotlinc" -version

      - name: Disc installer (corpus + Kotlin port)
        # The corpus generator builds a synthetic disc (ISO 9660 + MSI + LZX cabinet), installs it with
        # the TypeScript installer that the web build uses, and writes a manifest with the MD5 of every
        # file; then the Kotlin installer that ships in the APK has to produce the same files. A bug in
        # either implementation, or a drift between them, fails here -- in a minute, not on a phone.
        run: tools/installer-test.sh

      - name: Native syntax check (no NDK needed)
        run: tools/android-check.sh

      - name: Release rules (signing, version codes, update eligibility)
        run: tools/release-test.sh

      - name: Launcher (type-check against Android API stubs)
        # The launcher screen and the installer are compiled here as well: the Gradle build does it too,
        # but it needs the SDK and the NDK (minutes), and a renamed symbol should fail in seconds.
        run: tools/android-stubs.sh

      - name: Launcher (start-up on a plain JVM)
        # Type-checking is not enough: the activity once crashed before its first frame because a
        # `lateinit` view was used inside the `apply` block that was supposed to create it, which
        # compiles perfectly. This runs the real `onCreate`/`onResume` and pokes every control.
        run: tools/android-stubs-runtime.sh

      - name: Lint the build scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning tools/build-apk.sh tools/build-android.sh tools/android-version.sh \
            tools/android-check.sh tools/android-release-notes.sh tools/release-test.sh \
            tools/android-keygen.sh tools/etc2-test.sh tools/build-ffmpeg-android.sh \
            tools/installer-test.sh tools/android-stubs.sh tools/android-stubs-runtime.sh \
            .github/scripts/fetch-ffmpeg-android.sh

      - name: Version numbers
        run: |
          # (tools/release-test.sh covers the derivation; this only guards the CI-facing contract.)
          # Every build has to be installable over the previous one, so the version code must be a
          # positive number that grows with the history.
          out="$(tools/android-version.sh)"
          echo "version: $out"
          code="${out%% *}"
          [[ "$code" =~ ^[0-9]+$ ]] || { echo "versionCode is not numeric: $code"; exit 1; }
          [ "$code" -gt 0 ] || { echo "versionCode must be positive"; exit 1; }
          tagged="$(tools/android-version.sh v1.2.3)"
          [ "${tagged%% *}" = "10203" ] || { echo "tag version scheme is wrong: $tagged"; exit 1; }

  image:
    name: AOT image and packaged game
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      built: ${{ steps.exe.outputs.found }}
      game: ${{ steps.game.outputs.packed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci

      # The image is built from the player's own executable, which is never in the repository. When the
      # reference executable is not available (no secret, or the run is a pull request from a fork),
      # the image job is skipped and the APK ships without one -- the launcher then says so instead of
      # failing at start.
      - name: Fetch the reference executable
        id: exe
        env:
          SHREK2_EXE_BASE64: ${{ secrets.SHREK2_EXE_BASE64 }}
        run: |
          # Without the executable the APK still builds; the launcher then reports that the game is not
          # compiled instead of failing at start. (The secret is optional on purpose: a fork has none.)
          if [ -z "${SHREK2_EXE_BASE64:-}" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "no reference executable configured; the APK will carry no AOT image"
            exit 0
          fi
          mkdir -p work/reference
          printf '%s' "$SHREK2_EXE_BASE64" | base64 -d > "work/reference/Shrek 2.exe"
          echo "found=true" >> "$GITHUB_OUTPUT"
          ls -l "work/reference/Shrek 2.exe"

      # The game itself, for the APK to carry: the player installs the app and plays, without copying a
      # disc. It comes from a secret for the same reason the executable does -- it is the player's own copy
      # of the game and must never be committed. Two secrets are accepted, whichever is configured:
      #
      #   SHREK2_GAME_TARBALL_BASE64    a .tar.gz of an *installed* copy (the folder that holds `Game/`)
      #   SHREK2_ISO_BASE64             the disc image, which the reference installer unpacks here
      #
      # Neither set: the APK builds without the game, and the launcher falls back to "install from your
      # own disc image", which still works.
      - name: Pack the game into the APK
        id: game
        env:
          SHREK2_GAME_TARBALL_BASE64: ${{ secrets.SHREK2_GAME_TARBALL_BASE64 }}
          SHREK2_ISO_BASE64: ${{ secrets.SHREK2_ISO_BASE64 }}
        run: |
          mkdir -p android/app/src/main/assets
          if [ -n "${SHREK2_GAME_TARBALL_BASE64:-}" ]; then
            mkdir -p work/game-in
            printf '%s' "$SHREK2_GAME_TARBALL_BASE64" | base64 -d > work/game.tar.gz
            tar -xzf work/game.tar.gz -C work/game-in
            # Accept a tarball of the installed folder or of its parent (it holds `Game/` either way).
            root="$(dirname "$(find work/game-in -name 'Shrek 2.exe' -path '*/Game/*' | head -1)")/.."
            node tools/pack-game.mjs --from-dir "$root" --out android/app/src/main/assets
          elif [ -n "${SHREK2_ISO_BASE64:-}" ]; then
            printf '%s' "$SHREK2_ISO_BASE64" | base64 -d > work/game.iso
            node tools/pack-game.mjs --from-iso work/game.iso --out android/app/src/main/assets
            rm -f work/game.iso
          else
            echo "No game secret: the APK carries no game and the launcher offers the disc image instead."
            echo "packed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "packed=true" >> "$GITHUB_OUTPUT"
          cat android/app/src/main/assets/game/stamp.txt

      - name: Build and check the image
        if: steps.exe.outputs.found == 'true'
        run: |
          # The metadata describes the executable; it is optional for the compiler but makes the HLE
          # export table exact, so pass it when the checkout has one.
          meta=""
          if ls metadata/*.json >/dev/null 2>&1; then meta="$(ls metadata/*.json | head -1)"; fi
          node aot/cli.ts image "work/reference/Shrek 2.exe" ${meta:+--meta "$meta"} --out work/aot
          node aot/cli.ts check work/aot
          du -h work/aot/game.sk2a

      - name: Bundle the image and the game for the APK job
        if: steps.exe.outputs.found == 'true' || steps.game.outputs.packed == 'true'
        run: |
          # One artifact for the APK job, holding whatever this job managed to produce. `upload-artifact`
          # fails on a path that does not exist, so collect into a directory first.
          mkdir -p work/bundle
          if [ "${{ steps.exe.outputs.found }}" = "true" ]; then
            cp work/aot/game.sk2a work/aot/game.skx work/aot/aot.txt work/bundle/
          fi
          if [ "${{ steps.game.outputs.packed }}" = "true" ]; then
            cp -r android/app/src/main/assets/game work/bundle/game
          fi
          ls -la work/bundle

      - uses: actions/upload-artifact@v4
        if: steps.exe.outputs.found == 'true' || steps.game.outputs.packed == 'true'
        with:
          name: aot-image
          path: work/bundle/
          retention-days: 7

  apk:
    name: Build debug APK
    needs: [checks, image]
    # `image` is skipped when there is no reference executable; that must not block the APK.
    if: always() && needs.checks.result == 'success' && (needs.image.result == 'success' || needs.image.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FFMPEG_VERSION: '7.1.1'
      NDK_VERSION: '27.0.12077973'
    outputs:
      version_code: ${{ steps.version.outputs.code }}
      version_name: ${{ steps.version.outputs.name }}
      signed: ${{ steps.keystore.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tags and history: the version code is derived from them

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK and NDK
        run: |
          # The NDK version is pinned in android/app/build.gradle.kts; the runner's SDK ships with the
          # command line tools that install it.
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;35.0.0" "ndk;$NDK_VERSION" "cmake;3.22.1" > /dev/null

      - name: Version
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          [[ "$tag" == v* ]] || tag=""
          read -r code name <<<"$(tools/android-version.sh "$tag")"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "building $name ($code)"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Cache FFmpeg for arm64
        uses: actions/cache@v4
        with:
          # Video playback links libavcodec, exactly like the desktop build. Cached: it is the slowest
          # step here and changes only when the FFmpeg version or the NDK revision changes.
          # One path, so the downloaded source is cached with the result: a build that has to retry the
          # download does not have to do it again on the next run.
          path: work/tools
          # Keyed on the build scripts too: a change to how FFmpeg is configured must not be served a
          # stale archive from the cache (that is how a non-PIC build reached the linker).
          key: ffmpeg-android-${{ env.FFMPEG_VERSION }}-${{ env.NDK_VERSION }}-${{ hashFiles('tools/build-ffmpeg-android.sh', '.github/scripts/fetch-ffmpeg-android.sh') }}

      - name: FFmpeg for arm64 (Bink decoders)
        id: ffmpeg
        # Bink video needs it; the CMake configure refuses to build without it, so a failure here must
        # not silently produce an APK with broken cutscenes -- fail the job with the whole log instead.
        run: |
          set -o pipefail
          if ! .github/scripts/fetch-ffmpeg-android.sh 2>&1 | tee ffmpeg.log; then
            echo "::error title=FFmpeg build failed::the Bink decoders could not be built"
            # The runner cannot stream a failing step's log over the API while it runs, so the tail is
            # repeated as annotations: that is what shows up in the web UI and in `gh run view`.
            tail -n 30 ffmpeg.log | sed 's/^/::error::/'
            exit 1
          fi

      - name: Signing key
        id: keystore
        env:
          SHREK2_KEYSTORE_BASE64: ${{ secrets.SHREK2_KEYSTORE_BASE64 }}
          SHREK2_KEYSTORE_PASSWORD: ${{ secrets.SHREK2_KEYSTORE_PASSWORD }}
          SHREK2_KEY_ALIAS: ${{ secrets.SHREK2_KEY_ALIAS }}
          SHREK2_KEY_PASSWORD: ${{ secrets.SHREK2_KEY_PASSWORD }}
        run: |
          # Every APK is signed, because an unsigned one cannot be installed at all ("the package
          # appears to be corrupt"). With no release key configured the build uses the debug key that is
          # committed to the repository -- the same key in every checkout and on every runner, so each
          # build replaces the installed app instead of fighting it.
          if [ -z "${SHREK2_KEYSTORE_BASE64:-}" ]; then
            echo "signed=debug" >> "$GITHUB_OUTPUT"
            echo "keystore=" >> "$GITHUB_OUTPUT"
            echo "No release keystore secret: signing with android/debug.keystore (installs and updates in place)."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$SHREK2_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keys/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/keys/release.jks"
            echo "storePassword=$SHREK2_KEYSTORE_PASSWORD"
            echo "keyAlias=$SHREK2_KEY_ALIAS"
            echo "keyPassword=$SHREK2_KEY_PASSWORD"
          } > android/keystore.properties
          echo "signed=release" >> "$GITHUB_OUTPUT"
          echo "keystore=$RUNNER_TEMP/keys/release.jks" >> "$GITHUB_OUTPUT"

      - name: AOT image and packaged game
        # Only when the image job produced them: without a reference executable or a game secret there
        # is nothing to download, and the APK is still built.
        if: needs.image.outputs.built == 'true' || needs.image.outputs.game == 'true'
        uses: actions/download-artifact@v4
        with:
          name: aot-image
          path: android/app/src/main/assets

      - name: What this APK carries
        run: |
          # Written to the summary: it decides whether the player sees "Play" or "Install from your own
          # disc", and that should be visible without reading the APK.
          game="$(cat android/app/src/main/assets/game/stamp.txt 2>/dev/null || echo 'none (the launcher offers the disc image)')"
          image="$(ls -l android/app/src/main/assets/game.sk2a 2>/dev/null | awk '{print $5" bytes"}' || echo 'none (the game will be compiled on first start)')"
          echo "game: $game"; echo "aot image: $image"
          {
            echo "## What this APK carries"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| game | $game |"
            echo "| AOT image | $image |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Assemble
        env:
          SHREK2_VERSION_CODE: ${{ steps.version.outputs.code }}
          SHREK2_VERSION_NAME: ${{ steps.version.outputs.name }}
          # Empty when the build is unsigned: build.gradle.kts then skips the signing config entirely.
          SHREK2_KEYSTORE: ${{ steps.keystore.outputs.keystore }}
        working-directory: android
        run: |
          # The runner's shell has no pipefail, and without it a pipeline through `tee` always "succeeds".
          set -o pipefail
          # No committed wrapper: generate one from the installed Gradle, then build with it.
          [ -x ./gradlew ] || gradle wrapper --gradle-version 8.9 --no-daemon
          # The runner does not expose a step's log while it runs; repeat the tail as annotations so a
          # failure is diagnosable from the API.
          # Report the signing configuration first: a build that is not signed is not installable, so the
          # log has to say which key Gradle picked before the expensive part starts.
          ./gradlew --no-daemon -q signingReport 2>&1 | tee ../signing.log || true
          grep -A3 "Variant: debug" ../signing.log | head -8 || true
          if ! ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee -a ../assemble.log; then
            grep -E "error:|e: |FAILURE|What went wrong|Caused by|^\* " -A2 ../assemble.log | tail -n 40 | sed 's/^/::error::/' || true
            tail -n 20 ../assemble.log | sed 's/^/::error::/'
            exit 1
          fi

      - name: Inspect the APK
        run: |
          set -o pipefail
          # Write what was built into the job summary: the artifact and the runner's log storage are not
          # always reachable (this sandbox cannot download either), the summary always is.
          {
            echo "## APK"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| variant | debug |"
            echo "| version | ${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }}) |"
            echo "| requested key | ${{ steps.keystore.outputs.signed }} |"
            echo "| triggering ref | \`${{ github.ref }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          ls -l android/app/build/outputs/apk/debug/ || true
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          # An unsignable build is named ...-unsigned.apk by AGP. Never accept it: it cannot be installed.
          if [ ! -f "$APK" ] && [ -f android/app/build/outputs/apk/debug/app-debug-unsigned.apk ]; then
            echo "::error title=the APK is unsigned::AGP produced app-debug-unsigned.apk"
            sed 's/^/::error::/' assemble.log | tail -n 20
            exit 1
          fi
          [ -f "$APK" ] || { echo "::error::no APK was produced"; exit 1; }
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          echo "APK: $APK ($(stat -c%s "$APK") bytes)"
          unzip -l "$APK" | grep -E "META-INF/" || echo "(no META-INF entries: unsigned v1, expected for v2-only signing)"
          unzip -l "$APK" | head -6
          "$BT/aapt2" dump badging "$APK" | grep -E "^package:|^native-code:"
          # The APK must verify: an unsigned or badly signed one shows up on the phone as
          # "app not installed".
          # `apksigner` writes "Verifies" and the schemes to stdout and everything else to stderr, so the
          # two streams are kept apart: "the APK is corrupt" is the message that matters, and it is a
          # non-zero exit plus something on stderr.
          if "$BT/apksigner" verify --print-certs "$APK" > sign.txt 2> sign.err; then
            cat sign.txt
            if [ -s sign.err ]; then echo "apksigner warnings:"; cat sign.err; fi
          else
            echo "=== apksigner stdout"; cat sign.txt
            echo "=== apksigner stderr"; cat sign.err
            echo "::error title=the APK does not verify::$(tr '\n' ' ' < sign.err | head -c 300)"
            exit 1
          fi
          # `--print-certs` names the signer differently depending on the scheme (v3 shows "V3.0 Signer"),
          # so any certificate line counts as signed.
          if ! grep -E "certificate SHA-256 digest:" sign.txt > /dev/null; then
            echo "::error title=no signer certificate in the APK::$(head -c 200 sign.txt | tr '\n' ' ')"
            echo "=== assemble.log tail"
            tail -n 25 assemble.log 2>/dev/null || echo "(no assemble.log)"
            exit 1
          fi
          cert="$(sed -n 's/.*certificate SHA-256 digest: //p' sign.txt | head -1)"
          dn="$(sed -n 's/.*certificate DN: //p' sign.txt | head -1)"
          echo "SIGNATURE ok: $(grep -c "^Verified using v[23] scheme" sign.txt) scheme(s), cert ${cert:0:16}..."
          # The native library is what makes the APK an app at all.
          # (`grep -q` would exit early, unzip would die of SIGPIPE, and `pipefail` would fail the step.)
          if ! unzip -l "$APK" | grep -E "lib/arm64-v8a/libshrek2\.so" > /dev/null; then
            echo "::error::the APK has no arm64 native library"; unzip -l "$APK" | head -20 | sed 's/^/::error::'; exit 1
          fi
          # The target is arm64 only: an APK that also carries x86 libraries means the ABI filter broke.
          if [ "$(unzip -l "$APK" | grep -cE "^ *[0-9]+ .* lib/(x86|x86_64|armeabi)/")" -ne 0 ]; then
            echo "::error::the APK carries ABIs other than arm64-v8a"
            unzip -l "$APK" | grep "lib/" | sed 's/^/::error::/'
            exit 1
          fi
          # The image is optional in a fork without the reference executable, so only warn.
          unzip -l "$APK" | grep -E "assets/game\.sk2a" || echo "::warning::the APK carries no AOT image"
          # The packaged game is optional too, but if it is there it must be complete: the launcher
          # unpacks it on first start and would fail on a half-included tree.
          if unzip -l "$APK" | grep -qE "assets/game/stamp\.txt"; then
            echo "game: $(unzip -p "$APK" assets/game/stamp.txt)"
            if ! unzip -l "$APK" | grep -qE "assets/game/Game/Shrek 2\.exe"; then
              echo "::error::the APK carries a game stamp but no assets/game/Game/Shrek 2.exe"
              exit 1
            fi
            echo "| game | $(unzip -p "$APK" assets/game/stamp.txt) |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "no packaged game; the launcher offers the disc image"
            echo "| game | none (disc image install) |" >> "$GITHUB_STEP_SUMMARY"
          fi
          sha="$(sha256sum "$APK" | cut -d" " -f1)"
          echo "APK_RESULT name=$(basename "$APK") size=$(stat -c%s "$APK") sha256=$sha cert=$cert"
          {
            echo "| file | $(basename "$APK") ($(du -h "$APK" | cut -f1)) |"
            echo "| certificate | ${dn:-unknown} — ${cert:0:16}... |"
            echo "| sha256 | $sha |"
            echo "| native | arm64-v8a/libshrek2.so |"
            echo "| image | $(unzip -l "$APK" | grep -cE "assets/game\.sk2a") packaged |"
            echo "| contents | $(unzip -l "$APK" | tail -1) |"
          } >> "$GITHUB_STEP_SUMMARY"
          # Remove the keystore before anything is archived.
          rm -f android/keystore.properties

      - name: Rename
        id: apk
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          [ -f "$APK" ] || APK=android/app/build/outputs/apk/debug/app-debug-unsigned.apk
          OUT="shrek2-${{ steps.version.outputs.name }}-debug.apk"
          cp "$APK" "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          echo "$(sha256sum "$OUT")" > "$OUT.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: |
            shrek2-*.apk
            shrek2-*.apk.sha256
          retention-days: 30

  release:
    name: Publish release
    needs: apk
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: apk-debug

      - name: Prove the APK installs as an update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          # The previous release's certificate has to match, or Android refuses the install ("app not
          # installed") and the player would have to uninstall, losing the game files.
          PREV_FROM_TAGS="$(git tag --list 'v*' --sort=-v:refname | grep -v "^${GITHUB_REF_NAME}$" | head -1 || true)"
          prev_code=""
          if [ -n "$PREV_FROM_TAGS" ]; then
            prev_code="$(tools/android-version.sh "$PREV_FROM_TAGS" | cut -d' ' -f1)"
          fi
          echo "previous tag: ${PREV_FROM_TAGS:-none} (versionCode ${prev_code:-unknown})"
          tools/android-release-notes.sh shrek2-*.apk "${{ needs.apk.outputs.version_code }}" "$prev_code"

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes shrek2-*.apk shrek2-*.apk.sha256 --verify-tag \
            || gh release upload "$GITHUB_REF_NAME" shrek2-*.apk shrek2-*.apk.sha256 --clobber
